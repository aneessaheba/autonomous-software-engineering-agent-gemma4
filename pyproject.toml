[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-swe"
version = "0.1.0"
description = "Autonomous software engineering agent built on Gemma 4 for the Kaggle Gemma 4 Developer Agent Competition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Anees Saheba Guddi" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "rich>=13.0",
]

[project.optional-dependencies]
kaggle = ["kaggle>=2.0", "six"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gemma-swe = "gemma_swe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
